openapi: 3.1.0
info:
  title: "Pedidos Web API"
  version: "0.1.0"
  description: >-
    API REST del portal de pedidos de la distribuidora, que moderniza Pedidos Legado.
    Contrato técnico de la API: cambia antes que el código. Las reglas de negocio y el
    comportamiento esperado están en specs/<historia>/spec.md.
servers:
  - url: "http://localhost:5080"
    description: Desarrollo local
tags:
  - name: "Salud"
    description: "Comprobar que la API está arriba."
  - name: "Pedidos"
    description: "Consulta de los pedidos de la distribuidora."
paths:
  /salud:
    get:
      operationId: "obtenerSalud"
      tags: ["Salud"]
      summary: "Estado de la API"
      responses:
        "200":
          description: "La API está arriba."
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado:
                    type: string
                    enum: ["ok"]
              example:
                estado: "ok"
  /api/pedidos/{id}:
    get:
      operationId: "obtenerPedidoPorId"
      tags: ["Pedidos"]
      summary: "Detalle de un pedido"
      parameters:
        - name: id
          in: path
          required: true
          description: "Número correlativo del pedido."
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: "El pedido existe."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
              example:
                id: 21
                folio: "PED-ANT-000021"
                clienteId: "C-002"
                clienteNombre: "Minimarket Doña Rosa"
                fecha: "2026-10-31"
                estado: "Despachado"
                total: 75450
                sucursal: "ANT"
        "404":
          description: >-
            No existe un pedido con ese id. Hoy responde sin cuerpo.
            PENDIENTE_DESARROLLADOR: definir si adopta el formato de error común
            cuando se decida en la spec HU-01.
components:
  schemas:
    Pedido:
      type: object
      description: "Un pedido del sistema, tal como viene del legado."
      required: [id, folio, clienteId, clienteNombre, fecha, estado, total, sucursal]
      properties:
        id:
          type: integer
          format: int32
          description: "Número correlativo del pedido."
        folio:
          type: string
          description: "Folio con formato PED-{SUCURSAL}-{NUMERO}, con el número en 6 dígitos."
          pattern: "^PED-[A-Z]{2,4}-[0-9]{6}$"
        clienteId:
          type: string
          description: "Código del cliente, por ejemplo C-001."
        clienteNombre:
          type: string
          description: "Nombre del cliente."
        fecha:
          type: string
          format: date
          description: "Fecha de emisión (AAAA-MM-DD, hora local de Chile, sin hora)."
        estado:
          type: string
          description: >-
            Estado del pedido como texto, tal como lo guarda el legado. Los datos de ejemplo
            usan Pendiente, Confirmado, Despachado, Entregado y Anulado; la lista válida como
            contrato se decide en la spec HU-01.
        total:
          type: integer
          description: "Total en pesos chilenos (CLP), sin decimales."
        sucursal:
          type: string
          description: "Código de la sucursal que emitió el pedido."
